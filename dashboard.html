<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT-4G Smart Vehicle — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.2/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1417; --panel:#171e23; --panel2:#1c252b; --line:#2a333a;
    --text:#e7edf0; --dim:#7c8992; --mdim:#5b6b74;
    --green:#33d17a; --amber:#e8a33d; --red:#e4574c; --blue:#4d8fe0; --purple:#a682e8;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .topbar h1{ font-size:16px; margin:0; font-weight:600; }
  .who{ display:flex; align-items:center; gap:14px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--dim); }
  .role-badge{ padding:3px 9px; border-radius:5px; font-size:11px; font-weight:600; letter-spacing:0.3px; }
  .role-badge.admin{ background:#a682e830; color:var(--purple); }
  .role-badge.operator{ background:#4d8fe030; color:var(--blue); }
  .who button{
    background:transparent; border:1px solid var(--line); color:var(--dim); padding:6px 12px;
    border-radius:6px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif; font-size:12.5px;
  }
  .who button:hover{ color:var(--text); border-color:var(--red); }

  .tabs{ display:flex; gap:2px; padding:0 26px; background:var(--panel); border-bottom:1px solid var(--line); }
  .tab{ padding:12px 18px; font-size:13.5px; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active{ color:var(--text); border-bottom-color:var(--blue); }
  .tab.admin-tab{ color:var(--purple); }

  .view{ display:none; padding:26px; max-width:1180px; margin:0 auto; }
  .view.active{ display:block; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; }
  .panel h3{ margin:0 0 14px 0; font-size:13.5px; font-family:'IBM Plex Mono',monospace; color:var(--dim); font-weight:500; }
  .chart-wrap{ height:220px; display:flex; align-items:center; justify-content:center; }

  .device-list{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .device-row{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .device-row .head{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
  .device-head-left{ display:flex; align-items:center; gap:12px; }
  .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .dot.on{ background:var(--green); } .dot.off{ background:var(--red); }
  .dname{ font-weight:600; font-size:14.5px; }
  .dmeta{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--mdim); }
  .sim-badge{ font-size:10px; background:#5b6b7430; color:var(--dim); padding:2px 7px; border-radius:4px; margin-left:8px; }
  .chevron{ color:var(--mdim); font-size:12px; }

  .device-body{ display:none; margin-top:16px; border-top:1px solid var(--line); padding-top:16px; }
  .device-body.open{ display:block; }
  .override-banner{
    background:#a682e820; border:1px solid #a682e860; color:var(--purple); border-radius:8px;
    padding:9px 13px; font-size:12.5px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;
  }
  .override-banner button{
    background:transparent; border:1px solid var(--purple); color:var(--purple); border-radius:5px;
    padding:4px 10px; font-size:11.5px; cursor:pointer;
  }
  .ctrl-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .field-sm label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--dim); display:block; margin-bottom:5px; }
  .field-sm input{
    width:100%; background:#0f1417; border:1px solid var(--line); border-radius:6px; color:var(--text);
    padding:8px 10px; font-size:13px; margin-bottom:10px;
  }
  .btn{ background:var(--blue); border:none; color:#0b1116; font-weight:600; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:12.5px; }
  .btn.red{ background:var(--red); } .btn.grey{ background:var(--line); color:var(--text); }
  .btn.outline{ background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn:disabled{ opacity:0.45; cursor:default; }
  .dpad{ display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(2,40px); gap:6px; margin:10px 0; }
  .dpad button{ font-size:12px; }
  .telemetry-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
  .telemetry-grid .t{ background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .telemetry-grid .t .k{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--mdim); }
  .telemetry-grid .t .v{ font-size:15px; font-weight:600; margin-top:3px; }

  .msg-log{ background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    height:110px; overflow-y:auto; font-family:'IBM Plex Mono',monospace; font-size:12px; margin-bottom:8px; }
  .msg-log div{ margin-bottom:5px; color:var(--dim); }
  .msg-log div b{ color:var(--text); }
  .msg-send{ display:flex; gap:8px; }
  .msg-send input{ flex:1; background:#0f1417; border:1px solid var(--line); border-radius:6px; color:var(--text); padding:8px 10px; }

  .notif-row{ display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); align-items:flex-start; }
  .notif-row:last-child{ border-bottom:none; }
  .sev{ width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0; }
  .sev.info{ background:var(--blue); } .sev.warn{ background:var(--amber); } .sev.crit{ background:var(--red); }
  .notif-text{ flex:1; font-size:13.5px; }
  .notif-time{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--mdim); }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); padding:8px 10px; border-bottom:1px solid var(--line); }
  td{ padding:10px; border-bottom:1px solid var(--line); font-size:13px; }
  .create-user-form{ display:grid; grid-template-columns:1fr 1fr 140px 100px; gap:10px; margin-bottom:20px; align-items:end; }
  .create-user-form label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--dim); display:block; margin-bottom:5px; }
  .create-user-form input, .create-user-form select{
    width:100%; background:#0f1417; border:1px solid var(--line); border-radius:6px; color:var(--text); padding:8px 10px;
  }
  .tag{ padding:2px 8px; border-radius:5px; font-size:11px; }
  .tag.admin{ background:#a682e830; color:var(--purple); } .tag.operator{ background:#4d8fe030; color:var(--blue); }
  .tag.disabled{ background:#e4574c30; color:var(--red); }
</style>
</head>
<body>

<div class="topbar">
  <h1>IoT-4G Smart Vehicle — Command Center</h1>
  <div class="who">
    <span id="whoEmail">—</span>
    <span class="role-badge" id="roleBadge">—</span>
    <button id="signOutBtn">Sign out</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-view="dashboard">Dashboard</div>
  <div class="tab" data-view="devices">Devices Status</div>
  <div class="tab" data-view="notifications">Notifications</div>
  <div class="tab admin-tab" data-view="admin" id="adminTabBtn" style="display:none;">Admin</div>
</div>

<!-- DASHBOARD -->
<div class="view active" id="view-dashboard">
  <div class="grid2">
    <div class="panel">
      <h3>DEVICE STATUS</h3>
      <div class="chart-wrap"><canvas id="deviceChart"></canvas></div>
    </div>
    <div class="panel">
      <h3>TASK STATUS</h3>
      <div class="chart-wrap"><canvas id="taskChart"></canvas></div>
    </div>
  </div>
</div>

<!-- DEVICES -->
<div class="view" id="view-devices">
  <div class="panel">
    <h3>FLEET (<span id="deviceCount">0</span> devices)</h3>
    <div class="device-list" id="deviceList"></div>
  </div>
</div>

<!-- NOTIFICATIONS -->
<div class="view" id="view-notifications">
  <div class="panel">
    <h3>NOTIFICATIONS</h3>
    <div id="notifList"></div>
  </div>
</div>

<!-- ADMIN -->
<div class="view" id="view-admin">
  <div class="panel">
    <h3>CREATE USER</h3>
    <div class="create-user-form">
      <div><label>EMAIL</label><input id="newEmail" placeholder="operator2@iot4g.local"></div>
      <div><label>PASSWORD</label><input id="newPassword" type="text" placeholder="min 6 chars"></div>
      <div><label>ROLE</label>
        <select id="newRole"><option value="operator">Operator</option><option value="admin">Admin</option></select>
      </div>
      <div><button class="btn" id="createUserBtn" style="width:100%;">Create</button></div>
    </div>
    <div id="createUserMsg" style="font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:20px;"></div>

    <h3>USERS</h3>
    <table>
      <thead><tr><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
      <tbody id="userTableBody"></tbody>
    </table>

    <h3 style="margin-top:26px;">DEMO FLEET</h3>
    <button class="btn outline" id="seedBtn">Seed / refresh simulated demo devices</button>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "iot-4g-based-smart-vehicle.firebaseapp.com",
  databaseURL: "https://iot-4g-based-smart-vehicle-default-rtdb.firebaseio.com",
  projectId: "iot-4g-based-smart-vehicle",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let myRole = null;
const REAL_DEVICE_ID = "vehicle-01"; // matches the ESP32 firmware's device id

// ---------------- AUTH GATE ----------------
auth.onAuthStateChanged(user => {
  if(!user){ window.location.href = 'index.html'; return; }
  currentUser = user;
  db.ref('users/' + user.uid).get().then(snap => {
    const rec = snap.val();
    if(!rec || rec.disabled){ auth.signOut(); window.location.href = 'index.html'; return; }
    myRole = rec.role;
    document.getElementById('whoEmail').textContent = rec.email || user.email;
    const badge = document.getElementById('roleBadge');
    badge.textContent = myRole.toUpperCase();
    badge.className = 'role-badge ' + myRole;
    if(myRole === 'admin') document.getElementById('adminTabBtn').style.display = 'block';
    initApp();
  });
});
document.getElementById('signOutBtn').onclick = () => auth.signOut();

// ---------------- TABS ----------------
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('view-' + t.dataset.view).classList.add('active');
  };
});

// ---------------- CHARTS ----------------
let deviceChart, taskChart;
function initCharts(){
  const ctx1 = document.getElementById('deviceChart');
  deviceChart = new Chart(ctx1, { type:'doughnut',
    data:{ labels:['Online','Offline'], datasets:[{ data:[0,0], backgroundColor:['#33d17a','#e4574c'], borderWidth:0 }] },
    options:{ plugins:{ legend:{ labels:{ color:'#e7edf0' } } } } });

  const ctx2 = document.getElementById('taskChart');
  taskChart = new Chart(ctx2, { type:'doughnut',
    data:{ labels:['Towards pickup','Towards drop','Idle'], datasets:[{ data:[0,0,0], backgroundColor:['#33d17a','#4d8fe0','#8a6a4a'], borderWidth:0 }] },
    options:{ plugins:{ legend:{ labels:{ color:'#e7edf0' } } } } });
}

// ---------------- DEVICES ----------------
function initApp(){
  // Each piece is isolated: if one fails (e.g. the Chart.js CDN is
  // blocked), the rest of the app — buttons, listeners, other tabs —
  // still works instead of the whole page going unresponsive.
  try{ initCharts(); } catch(e){ console.error('Chart init failed:', e); }
  try{ listenDevices(); } catch(e){ console.error('Device listener failed:', e); }
  try{ listenNotifications(); } catch(e){ console.error('Notifications listener failed:', e); }
  if(myRole === 'admin'){
    try{ listenUsers(); } catch(e){ console.error('User listener failed:', e); }
    const seedBtn = document.getElementById('seedBtn');
    if(seedBtn) seedBtn.onclick = seedDemoFleet;
  }
  const createBtn = document.getElementById('createUserBtn');
  if(createBtn) createBtn.onclick = createUser;
}

function listenDevices(){
  db.ref('devices').on('value', snap => {
    const devices = snap.val() || {};
    renderCharts(devices);
    renderDeviceList(devices);
  });
}

function renderCharts(devices){
  if(!deviceChart || !taskChart) return; // charts never initialized (e.g. CDN blocked) — skip safely
  let online = 0, offline = 0, pick = 0, drop = 0, idle = 0;
  Object.values(devices).forEach(d => {
    if(d.status && d.status.online) online++; else offline++;
    const task = (d.telemetry && d.telemetry.task) || 'idle';
    if(task === 'toPickup') pick++; else if(task === 'toDrop') drop++; else idle++;
  });
  deviceChart.data.datasets[0].data = [online, offline]; deviceChart.update();
  taskChart.data.datasets[0].data = [pick, drop, idle]; taskChart.update();
}

function renderDeviceList(devices){
  const list = document.getElementById('deviceList');
  const ids = Object.keys(devices);
  document.getElementById('deviceCount').textContent = ids.length;
  list.innerHTML = '';
  ids.forEach(id => {
    const d = devices[id];
    const online = d.status && d.status.online;
    const link = (d.status && d.status.link) || '—';
    const row = document.createElement('div');
    row.className = 'device-row';
    row.innerHTML = `
      <div class="head" data-id="${id}">
        <div class="device-head-left">
          <span class="dot ${online ? 'on' : 'off'}"></span>
          <span class="dname">${id}${id !== REAL_DEVICE_ID ? '<span class="sim-badge">simulated</span>' : ''}</span>
          <span class="dmeta">${online ? 'ONLINE' : 'OFFLINE'} · ${link.toUpperCase()}</span>
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="device-body" id="body-${id}"></div>
    `;
    row.querySelector('.head').onclick = () => toggleDevice(id);
    list.appendChild(row);
  });
}

let openDeviceId = null;
let deviceListeners = {};
function toggleDevice(id){
  const body = document.getElementById('body-' + id);
  if(openDeviceId === id){
    body.classList.remove('open'); openDeviceId = null;
    if(deviceListeners[id]){ deviceListeners[id](); delete deviceListeners[id]; }
    return;
  }
  if(openDeviceId){
    document.getElementById('body-' + openDeviceId)?.classList.remove('open');
    if(deviceListeners[openDeviceId]){ deviceListeners[openDeviceId](); delete deviceListeners[openDeviceId]; }
  }
  openDeviceId = id;
  body.classList.add('open');
  renderDeviceControls(id, body);
}

function renderDeviceControls(id, body){
  body.innerHTML = `
    <div id="banner-${id}"></div>
    <div class="telemetry-grid" id="telem-${id}"></div>
    <div class="ctrl-grid">
      <div>
        <div class="field-sm">
          <label>PICKUP POINT</label><input id="pickup-${id}">
          <label>DESTINATION POINT</label><input id="dest-${id}">
        </div>
        <button class="btn" id="sendRoute-${id}">Send route</button>
        <hr style="border-color:#2a333a;margin:14px 0;">
        <button class="btn red" id="estop-${id}">EMERGENCY STOP</button>
        <button class="btn grey" id="estopClear-${id}" style="margin-left:8px;">Clear stop</button>
      </div>
      <div>
        <div class="field-sm"><label>MANUAL CONTROL</label></div>
        <button class="btn outline" id="manualToggle-${id}">Enable manual control</button>
        <div class="dpad" id="dpad-${id}" style="display:none;">
          <span></span><button data-dir="F">▲</button><span></span>
          <button data-dir="L">◀</button><button class="red" data-dir="STOP">■</button><button data-dir="R">▶</button>
          <span></span><button data-dir="B">▼</button><span></span>
        </div>
        ${myRole === 'admin' ? `<div style="margin-top:14px;"><button class="btn" id="overrideBtn-${id}">Take control (override)</button></div>` : ''}
      </div>
    </div>
    <h3 style="margin-top:18px;">TWO-WAY MESSAGES</h3>
    <div class="msg-log" id="msglog-${id}"></div>
    <div class="msg-send"><input id="msgInput-${id}" placeholder="Message to vehicle…"><button class="btn" id="msgSend-${id}">Send</button></div>
  `;

  const deviceRef = db.ref('devices/' + id);
  const unsub1 = deviceRef.on('value', snap => renderDeviceState(id, snap.val() || {}));
  const msgRef = db.ref('devices/' + id + '/messages').limitToLast(20);
  const unsub2 = msgRef.on('value', snap => renderMessages(id, snap.val() || {}));

  deviceListeners[id] = () => { deviceRef.off('value', unsub1); msgRef.off('value', unsub2); };

  document.getElementById('sendRoute-' + id).onclick = () => sendControl(id, {
    pickup: document.getElementById('pickup-' + id).value,
    destination: document.getElementById('dest-' + id).value
  });
  document.getElementById('estop-' + id).onclick = () =>
    db.ref('devices/' + id + '/control/emergencyStopGlobal').set({ active:true, by: currentUser.email, role: myRole, ts: Date.now() });
  document.getElementById('estopClear-' + id).onclick = () =>
    db.ref('devices/' + id + '/control/emergencyStopGlobal').set({ active:false, by: currentUser.email, role: myRole, ts: Date.now() });

  document.getElementById('manualToggle-' + id).onclick = (e) => {
    const dpad = document.getElementById('dpad-' + id);
    const enabling = dpad.style.display === 'none';
    dpad.style.display = enabling ? 'grid' : 'none';
    e.target.textContent = enabling ? 'Disable manual control' : 'Enable manual control';
    sendControl(id, { mode: enabling ? 'manual' : 'auto' });
  };
  document.querySelectorAll('#dpad-' + id + ' button').forEach(b => {
    b.onclick = () => sendControl(id, { manualDir: b.dataset.dir, manualTs: Date.now() });
  });

  if(myRole === 'admin'){
    document.getElementById('overrideBtn-' + id).onclick = () => {
      db.ref('devices/' + id + '/control/activeSource').set('admin');
    };
  }

  document.getElementById('msgSend-' + id).onclick = () => {
    const input = document.getElementById('msgInput-' + id);
    if(!input.value.trim()) return;
    db.ref('devices/' + id + '/messages').push({ from: currentUser.email, role: myRole, text: input.value.trim(), ts: Date.now() });
    input.value = '';
  };
}

function renderDeviceState(id, d){
  const telem = d.telemetry || {};
  document.getElementById('telem-' + id).innerHTML = `
    <div class="t"><div class="k">SPEED</div><div class="v">${telem.speed ?? '—'} km/h</div></div>
    <div class="t"><div class="k">BATTERY</div><div class="v">${telem.battery ?? '—'}%</div></div>
    <div class="t"><div class="k">GPS</div><div class="v" style="font-size:12px;">${telem.lat ? telem.lat.toFixed(4)+', '+telem.lng.toFixed(4) : '—'}</div></div>
    <div class="t"><div class="k">TASK</div><div class="v" style="font-size:12px;">${telem.task || 'idle'}</div></div>
  `;
  const activeSource = (d.control && d.control.activeSource) || 'operator';
  const eStop = d.control && d.control.emergencyStopGlobal;
  const banner = document.getElementById('banner-' + id);
  let bannerHtml = '';
  if(activeSource === 'admin'){
    bannerHtml += `<div class="override-banner">Admin has taken control of this vehicle.
      ${myRole === 'admin' ? `<button id="release-${id}">Release to operator</button>` : ''}</div>`;
  }
  if(eStop && eStop.active){
    bannerHtml += `<div class="override-banner" style="background:#e4574c20;border-color:#e4574c60;color:#e4574c;">
      EMERGENCY STOP ACTIVE — set by ${eStop.by} (${eStop.role})</div>`;
  }
  banner.innerHTML = bannerHtml;
  const releaseBtn = document.getElementById('release-' + id);
  if(releaseBtn) releaseBtn.onclick = () => db.ref('devices/' + id + '/control/activeSource').set('operator');

  // Operators lose write ability while admin holds override
  const disableForOperator = (myRole !== 'admin' && activeSource === 'admin');
  document.querySelectorAll(`#body-${id} .ctrl-grid button, #body-${id} .ctrl-grid input`).forEach(el => {
    el.disabled = disableForOperator;
  });
}

function renderMessages(id, msgs){
  const log = document.getElementById('msglog-' + id);
  if(!log) return;
  log.innerHTML = Object.values(msgs).map(m => `<div><b>${m.from} (${m.role})</b>: ${m.text}</div>`).join('') || '<div>No messages yet.</div>';
  log.scrollTop = log.scrollHeight;
}

// Writes go to control/operator or control/admin depending on who's acting;
// activeSource decides which one the vehicle should actually obey.
function sendControl(id, fields){
  const node = myRole === 'admin' ? 'admin' : 'operator';
  fields.issuedBy = currentUser.email;
  fields.ts = Date.now();
  db.ref(`devices/${id}/control/${node}`).update(fields);
  if(myRole === 'admin') db.ref(`devices/${id}/control/activeSource`).set('admin');
}

// ---------------- NOTIFICATIONS ----------------
function listenNotifications(){
  db.ref('notifications').limitToLast(50).on('value', snap => {
    const items = Object.values(snap.val() || {}).sort((a,b) => b.ts - a.ts);
    const list = document.getElementById('notifList');
    list.innerHTML = items.length ? items.map(n => `
      <div class="notif-row">
        <span class="sev ${n.severity || 'info'}"></span>
        <span class="notif-text">${n.message}</span>
        <span class="notif-time">${new Date(n.ts).toLocaleString()}</span>
      </div>`).join('') : '<div style="color:#7c8992;padding:10px;">No notifications yet.</div>';
  });
}

// ---------------- ADMIN: USERS ----------------
function listenUsers(){
  db.ref('users').on('value', snap => {
    const users = snap.val() || {};
    const body = document.getElementById('userTableBody');
    body.innerHTML = Object.entries(users).map(([uid, u]) => `
      <tr>
        <td>${u.email}</td>
        <td><span class="tag ${u.role}">${u.role}</span></td>
        <td>${u.disabled ? '<span class="tag disabled">disabled</span>' : 'active'}</td>
        <td>${uid !== currentUser.uid ? `<button class="btn ${u.disabled ? '' : 'red'}" data-uid="${uid}" data-disabled="${!!u.disabled}">${u.disabled ? 'Enable' : 'Disable'}</button>` : ''}</td>
      </tr>`).join('');
    body.querySelectorAll('button[data-uid]').forEach(btn => {
      btn.onclick = () => db.ref('users/' + btn.dataset.uid + '/disabled').set(btn.dataset.disabled === 'false');
    });
  });
}

// Secondary Firebase app instance so creating a user doesn't sign the admin out
function createUser(){
  const email = document.getElementById('newEmail').value.trim();
  const password = document.getElementById('newPassword').value;
  const role = document.getElementById('newRole').value;
  const msgEl = document.getElementById('createUserMsg');
  if(!email || password.length < 6){ msgEl.textContent = 'Enter an email and a password of at least 6 characters.'; return; }

  const secondary = firebase.apps.find(a => a.name === 'Secondary') || firebase.initializeApp(FIREBASE_CONFIG, 'Secondary');
  secondary.auth().createUserWithEmailAndPassword(email, password)
    .then(cred => db.ref('users/' + cred.user.uid).set({ email, role, disabled:false, createdBy: currentUser.email, createdAt: Date.now() })
      .then(() => secondary.auth().signOut()))
    .then(() => { msgEl.textContent = 'User created.'; document.getElementById('newEmail').value=''; document.getElementById('newPassword').value=''; })
    .catch(err => { msgEl.textContent = err.message; });
}

// ---------------- DEMO FLEET SEEDING ----------------
function seedDemoFleet(){
  const tasks = ['toPickup','toDrop','idle'];
  const updates = {};
  for(let i = 1; i <= 9; i++){
    const id = 'demo-' + i;
    const online = Math.random() > 0.3;
    updates['devices/' + id + '/status'] = { online, link: Math.random() > 0.5 ? 'wifi' : 'lte', lastSeen: Date.now() };
    updates['devices/' + id + '/telemetry'] = {
      speed: Math.floor(Math.random()*20), battery: Math.floor(50+Math.random()*50),
      lat: 19.07 + Math.random()*0.05, lng: 72.87 + Math.random()*0.05,
      task: tasks[Math.floor(Math.random()*tasks.length)]
    };
  }
  db.ref().update(updates);
}
